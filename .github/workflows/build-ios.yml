name: Build iOS 14 IPA
on:
  push:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and check source compatibility
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          python3 ios/scripts/check_compatibility.py
          python3 ios/scripts/generate_project.py
          git diff --exit-code -- ios/AkiChat.xcodeproj
          plutil -lint ios/AkiChat/Info.plist ios/AkiChat.xcodeproj/project.pbxproj
      - name: Compile real arm64 iPhoneOS Release (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project ios/AkiChat.xcodeproj -scheme AkiChat -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/device-build.log
      - name: Validate and package actual app
        run: |
          set -euo pipefail
          python3 ios/scripts/package_ipa.py build/device/Build/Products/Release-iphoneos/AkiChat.app build/AkiChat-iOS14-unsigned.ipa
          python3 ios/scripts/package_ipa.py build/device/Build/Products/Release-iphoneos/AkiChat.app build/AkiChat-iOS14-adhoc.ipa --adhoc
          (cd build && shasum -a 256 AkiChat-*.ipa > SHA256SUMS.txt)
      - name: Prepare simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > build/devices.json
          DEVICE_ID=$(python3 - <<'PY'
          import json
          data = json.load(open('build/devices.json'))
          devices = [(runtime, d) for runtime, entries in data['devices'].items() if 'iOS-18-5' in runtime for d in entries if d.get('isAvailable') and 'iPhone' in d['name']]
          if not devices:
              raise SystemExit('No iOS 18.5 iPhone simulator for Xcode 16.4; install that runtime or update the runner configuration.')
          print(devices[0][1]['udid'])
          PY
          )
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Run mock unit tests and compiler availability checks
        run: |
          set -euo pipefail
          xcodebuild -project ios/AkiChat.xcodeproj -scheme AkiChat -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS=AkiChat/Simulator.entitlements \
            -parallel-testing-enabled NO test 2>&1 | tee build/test.log
      - name: Capture launch screenshot
        run: |
          set -euo pipefail
          xcrun simctl launch '${{ steps.simulator.outputs.id }}' com.akisenn.akichat
          sleep 3
          xcrun simctl io '${{ steps.simulator.outputs.id }}' screenshot build/launch.png
      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: AkiChat-iOS14
          path: |
            build/AkiChat-iOS14-unsigned.ipa
            build/AkiChat-iOS14-adhoc.ipa
            build/SHA256SUMS.txt
            build/launch.png
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AkiChat-build-diagnostics
          path: |
            build/*.log
            build/Tests.xcresult
          if-no-files-found: ignore
      - name: Publish tag Release assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "AkiChat $TAG" --generate-notes
          fi
          gh release upload "$TAG" build/AkiChat-iOS14-unsigned.ipa build/AkiChat-iOS14-adhoc.ipa build/SHA256SUMS.txt --clobber
