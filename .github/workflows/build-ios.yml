name: Build iOS 14 IPA
on:
  push:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and check source compatibility
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          python3 ios/scripts/check_compatibility.py
          python3 ios/scripts/generate_project.py
          git diff --exit-code -- ios/AkiChat.xcodeproj
          plutil -lint ios/AkiChat/Info.plist ios/AkiChat.xcodeproj/project.pbxproj
      - name: Compile real arm64 iPhoneOS Release (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project ios/AkiChat.xcodeproj -scheme AkiChat -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/device-build.log
      - name: Validate and package actual app
        run: |
          set -euo pipefail
          python3 ios/scripts/package_ipa.py build/device/Build/Products/Release-iphoneos/AkiChat.app build/AkiChat-iOS14-unsigned.ipa
          python3 ios/scripts/package_ipa.py build/device/Build/Products/Release-iphoneos/AkiChat.app build/AkiChat-iOS14-adhoc.ipa --adhoc
          (cd build && shasum -a 256 AkiChat-*.ipa > SHA256SUMS.txt)
      - name: Prepare simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list runtimes -j > build/runtimes.json
          xcrun simctl list devices available -j > build/devices.json
          DEVICE_ID=$(python3 - <<'PY'
          import json
          data = json.load(open('build/devices.json'))
          from pathlib import Path
          available = [(runtime, d) for runtime, entries in data['devices'].items() for d in entries if d.get('isAvailable') and 'iPhone' in d['name']]
          ios16 = [(r, d) for r, d in available if 'iOS-16-' in r]
          devices = ios16 or [(r, d) for r, d in available if 'iOS-18-5' in r]
          if not devices:
              raise SystemExit('No compatible iOS 16 / 18.5 iPhone runtime available for testing.')
          runtime, device = devices[0]
          Path('build/runtime-report.json').write_text(json.dumps({'selectedRuntime': runtime, 'iOS16Available': bool(ios16), 'fpsMeasured': False}, indent=2))
          print(device['udid'])
          PY
          )
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Run mock unit tests and compiler availability checks
        run: |
          set -euo pipefail
          xcodebuild -project ios/AkiChat.xcodeproj -scheme AkiChat -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS=AkiChat/Simulator.entitlements \
            -skip-testing:AkiChatUITests -parallel-testing-enabled NO test 2>&1 | tee build/test.log
      - name: Run native UI interaction smoke tests
        run: |
          set -euo pipefail
          xcodebuild -project ios/AkiChat.xcodeproj -scheme AkiChat -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/simulator -resultBundlePath build/UITests.xcresult \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGN_ENTITLEMENTS='' \
            -only-testing:AkiChatUITests -parallel-testing-enabled NO test 2>&1 | tee build/ui-test.log
      - name: Capture launch screenshot
        run: |
          set -euo pipefail
          xcrun simctl terminate '${{ steps.simulator.outputs.id }}' com.akisenn.akichat || true
          xcrun simctl launch '${{ steps.simulator.outputs.id }}' com.akisenn.akichat
          sleep 3
          xcrun simctl io '${{ steps.simulator.outputs.id }}' screenshot build/launch.png
          for COUNT in 0 100 500; do
            xcrun simctl launch --terminate-running-process '${{ steps.simulator.outputs.id }}' com.akisenn.akichat --ui-fixture "$COUNT"
            sleep 2
            xcrun simctl io '${{ steps.simulator.outputs.id }}' screenshot "build/ui-fixture-$COUNT-dark.png"
          done
      - name: Attempt Time Profiler on synthetic 500-message page
        run: |
          set -euo pipefail
          PID=$(xcrun simctl launch --terminate-running-process '${{ steps.simulator.outputs.id }}' com.akisenn.akichat --ui-fixture 500 | awk '{print $NF}')
          if xcrun xctrace record --template 'Time Profiler' --device '${{ steps.simulator.outputs.id }}' --attach "$PID" --time-limit 10s --output build/Performance.trace > build/profiler.log 2>&1; then
            xcrun xctrace export --input build/Performance.trace --toc --output build/profiler-toc.xml
            echo 'Captured Time Profiler for synthetic 500-message page; no FPS measurement.'
          else
            echo 'Time Profiler unavailable in this runner. Inspect profiler.log; no measured speedup or FPS claim.'
          fi
      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: AkiChat-iOS14
          path: |
            build/AkiChat-iOS14-unsigned.ipa
            build/AkiChat-iOS14-adhoc.ipa
            build/SHA256SUMS.txt
            build/launch.png
            build/ui-fixture-*.png
            build/runtime-report.json
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AkiChat-build-diagnostics
          path: |
            build/*.log
            build/Tests.xcresult
            build/UITests.xcresult
            build/Performance.trace
            build/profiler-toc.xml
            build/runtime-report.json
            build/runtimes.json
          if-no-files-found: ignore
      - name: Publish tag Release assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/device/Build/Products/Release-iphoneos/AkiChat.app/Info.plist)
          test "$TAG" = "v$BUILT_VERSION"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" --draft --title "AkiChat $TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" build/AkiChat-iOS14-unsigned.ipa build/AkiChat-iOS14-adhoc.ipa build/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --title "AkiChat $TAG" --notes-file docs/RELEASE_NOTES.md
          if [ "$TAG" = 'v1.2.0' ]; then
            # Maintainer-authorized correction from the mistaken 2.x release naming.
            gh release edit "$TAG" --latest
            if gh release view 'v2.0.2' > /dev/null 2>&1; then
              gh release edit 'v2.0.2' --draft=true
              test "$(gh release view 'v2.0.2' --json isDraft --jq .isDraft)" = 'true'
            else
              echo 'v2.0.2 release not found; no old release or tag was recreated.'
            fi
          fi
